global
    log /dev/log    local0
    log /dev/log    local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    http            # <-- 7-й уровень (HTTP)
    option  httplog
    option  dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000

frontend http_front
    bind *:8080

    # ACL: проверяем заголовок Host
    acl is_example_local hdr(host) -i example.local

    # Если домен НЕ example.local, возвращаем 403 Forbidden
    http-request deny deny_status 403 if !is_example_local

    default_backend http_back

backend http_back
    balance roundrobin
    # Веса: 2, 3 и 4 (сумма = 9)
    server srv1 127.0.0.1:8001 weight 2 check
    server srv2 127.0.0.1:8002 weight 3 check
    server srv3 127.0.0.1:8003 weight 4 check
